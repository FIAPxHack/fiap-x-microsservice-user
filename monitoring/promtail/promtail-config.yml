server:
  http_listen_port: 9081
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fiap-x-user-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: fiap-x-user
          service: user
          application: fiap-x-microsservice-user
          __path__: /var/log/app/*.log