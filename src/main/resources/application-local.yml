server:
  port: 8081

spring:
  application:
    name: fiap-x-microsservice-user

  # Configurações para desenvolvimento local
  datasource:
    url: jdbc:postgresql://db-fiap-x-user:5432/db_fiap_x_user
    username: fiap_user
    password: ${POSTGRES_PASSWORD:fiap_password_2026}
    driver-class-name: org.postgresql.Driver

  flyway:
    flyway:
      enabled: true
      baseline-on-migrate: true
      locations: classpath:db\migration
      out-of-order: false
      validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

# Logging para desenvolvimento
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.springframework.web: ${LOGGING_LEVEL_SPRING:INFO}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:INFO}
    br.com.fiapx.fiapxuser: ${LOGGING_LEVEL_FIAP_X_USER:DEBUG}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always