server:
  port: 8081

spring:
  application:
    name: fiap-x-microsservice-user

  # Configurações para desenvolvimento local
  datasource:
    url: jdbc:postgresql://localhost:5432/db_fiap_x_user
    username: ${POSTGRES_USER:fiap_user}
    password: ${POSTGRES_PASSWORD:fiap_password_2026}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true

# Logging para desenvolvimento
logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    br.com.fiapx.fiapxuser: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always